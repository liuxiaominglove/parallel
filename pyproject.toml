[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-parallel"
version = "0.1.0"
description = "Convert an English EPUB into a bilingual (Chinese-English) parallel EPUB using DeepSeek."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ebooklib>=0.18"]

[project.scripts]
epub-parallel = "epub_parallel.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
